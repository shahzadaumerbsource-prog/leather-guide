# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: leather-guide.docs.buildwithfern.com
title: Leather Guide | Documentation
layout:
  searchbar-placement: header
  page-width: full
navigation:
  - api: New Collection
    slug: new-collection
    flattened: true
  - changelog: ./changelog
    title: Blog
    slug: blog
colors:
  accent-primary:
    light: "#008700"
    dark: "#4ADE80"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
